name: test opencosmo
on: workflow_call

# Azure-hosted runners sporadically expose the MANA NIC as an RDMA verbs
# device (mana_0). UCX (used by the MPICH that setup-mpi installs) then tries
# to open a UD verbs transport on it and aborts MPI_Init with an I/O error.
# Restricting UCX to shared-mem/self/TCP avoids the verbs path entirely.
env:
  UCX_TLS: sm,self,tcp
  UCX_NET_DEVICES: lo

jobs:
  get-test-data:
    uses: ./.github/workflows/test-data.yaml
    secrets: inherit

  run-tests:
    name: Run tests
    runs-on: ${{ matrix.os }}
    needs: [get-test-data]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.12', '3.13', '3.14', '3.15']
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: get test data
        uses: actions/cache@v6
        with:
          path: test_data.tar.gz
          key: test-data
          enableCrossOsArchive: true
      - name: Unpack test data
        run: |
          mkdir -p test_data
          tar -xzf test_data.tar.gz -C test_data
      - name: install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78      
      - name: install python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-extras --group test

      - name: install analysis dependencies
        run: uv run opencosmo install haloviz --dev
      - name: Run tests with pytest
        run: |
          uv run pytest --ignore=test/parallel

  run-mpi-tests:
    name: Run mpi tests
    runs-on: ${{ matrix.os }}
    needs: [get-test-data]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.12', '3.13', '3.14', '3.15']
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup mpi
        uses: mpi4py/setup-mpi@v1
      - name: get test data
        uses: actions/cache@v6
        with:
          path: test_data.tar.gz
          key: test-data
          enableCrossOsArchive: true
      - name: Unpack test data
        run: |
          mkdir -p test_data
          tar -xzf test_data.tar.gz -C test_data
      - name: install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78      
      - name: install python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-extras --group test --group mpi --group test-mpi

      - name: Run tests with pytest
        run: |
          mpiexec -n 4 uv run pytest test/parallel
