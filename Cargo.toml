[package]
name = "opencosmo"
version = "1.4.7"
edition = "2021"

[lib]
name = "_lib"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib"]

[dependencies]
kiddo = "6.3.0"
numpy = "0.29"
petgraph = "0.8.3"
pyo3 = { version = "0.29", features = ["uuid"] }
uuid = "1.12"

